<!DOCTYPE html>
<html>
<head>
  <title>Hello EXE Builder</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 100px;
      background: #0e0e0e;
      color: white;
    }
    button {
      background: #00b894;
      border: none;
      padding: 1rem 2rem;
      border-radius: 10px;
      color: white;
      font-size: 1.2rem;
      cursor: pointer;
    }
    button:hover {
      background: #019875;
    }
  </style>
</head>
<body>
  <h1>Hello World EXE Builder</h1>
  <button id="build">Build EXE</button>

  <script>
    document.getElementById("build").addEventListener("click", async () => {
      const response = await fetch("/api/build");
      const blob = await response.blob();
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "hello.exe";
      a.click();
    });
  </script>
</body>
</html>
